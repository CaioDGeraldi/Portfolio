name: Portfolio Localization Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/i18n.js
          node --check scripts/stage.js
          node --check scripts/case.js
      - name: Verify localization, scene navigation, official logos and case studies
        run: node --test scripts/*.test.cjs
