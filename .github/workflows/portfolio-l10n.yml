name: Portfolio Localization Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/i18n.js
          node --check scripts/main.js
          node --check scripts/modules.js
      - name: Verify translations and language selection
        run: node --test scripts/i18n.test.cjs
