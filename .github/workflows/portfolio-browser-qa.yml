name: Portfolio Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency (browsers provided by image)
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Test responsive layout, navigation, language and theme
        run: npm run test:e2e
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
