name: Portfolio Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned project dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Test responsive layout, navigation, language, theme and accessibility
        run: npm run test:e2e
      - name: Upload 3D assembly visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-3d-visual-review
          path: test-results/assembly-visual-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
